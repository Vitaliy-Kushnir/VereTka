
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="description" content="A simple vector editor that uses the Gemini API to generate Python Tkinter code." />
    <link rel="apple-touch-icon" href="favicon.svg">
    <title>VereTka - Vector Editor for Canvas Tkinter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Marck+Script&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .font-handwriting {
        font-family: 'Caveat', 'Marck Script', cursive, 'Brush Script MT', sans-serif;
      }
      body {
        overscroll-behavior: none;
        user-select: none; /* Standard syntax */
        -webkit-user-select: none; /* Safari */
        -moz-user-select: none; /* Firefox */
        -ms-user-select: none; /* IE 10+ */
      }
      
      /* Allow selection on specific elements */
      input,
      textarea,
      [contenteditable="true"],
      .allow-selection {
        user-select: text; /* Standard syntax */
        -webkit-user-select: text; /* Safari */
        -moz-user-select: text; /* Firefox */
        -ms-user-select: text; /* IE 10+ */
      }

      /* Original Dark Theme */
      .dark-theme {
        --bg-app: #111827;
        --bg-primary: #1f2937;
        --bg-secondary: #374151;
        --bg-tertiary: #4b5563;
        --bg-hover: #4b5563;
        --bg-disabled: #4b5563;

        --text-primary: #f9fafb;
        --text-secondary: #e5e7eb;
        --text-tertiary: #9ca3af;
        --text-disabled: #6b7280;
        
        --border-primary: #374151;
        --border-secondary: #4b5563;
        --border-color: #374151;
        
        --accent-primary: #4f46e5;
        --accent-primary-hover: #6366f1;
        --accent-text: #ffffff;
        --icon-hover-text: #ffffff;
        
        --destructive-bg: #b91c1c; /* red-700 */
        --destructive-bg-hover: #dc2626; /* red-600 */
        --destructive-text: #f87171; /* red-400 */

        --selection-stroke: #3b82f6;
        --selection-fill: rgba(59, 130, 246, 0.2);
        --selection-highlight-bg: rgba(59, 130, 246, 0.5);
        --selection-highlight-text: #ffffff;
        --selection-highlight-comment-bg: rgba(59, 130, 246, 0.3);
        --selection-highlight-comment-text: #d1d5db;
        --special-handle-fill: #facc15;
        --special-handle-stroke: #f97316;

        --ruler-bg: #1f2937;
        --ruler-text: #9ca3af;
        --ruler-tick: #4b5563;
        
        --cursor-bg: var(--text-primary);
        --cursor-text: var(--bg-primary);

        --brand-header-text: #818cf8;
        --brand-badge-bg: rgba(99, 102, 241, 0.16);
        --brand-badge-border: rgba(129, 140, 248, 0.38);
        --brand-badge-border-hover: rgba(168, 85, 247, 0.55);
        --brand-badge-shadow: rgba(99, 102, 241, 0.22);
        --brand-badge-text-start: #c7d2fe;
        --brand-badge-text-mid: #e9d5ff;
        --brand-badge-text-end: #a5b4fc;
        --brand-badge-symbol: #a5b4fc;
        --brand-badge-dot-outer: rgba(129, 140, 248, 0.75);
        --brand-badge-dot-inner: #818cf8;
        --brand-badge-flourish: #818cf8;

        --input-bg: #1f2937;
        --input-border: #4b5563;
        --input-text: #f9fafb;
        --input-placeholder: #9ca3af;
        --card-bg: #1f2937;
        --card-border: #374151;
        --modal-overlay: rgba(0, 0, 0, 0.75);
      }

      /* Light Theme */
      .light-theme {
        --bg-app: #f3f4f6;
        --bg-primary: #ffffff;
        --bg-secondary: #e5e7eb;
        --bg-tertiary: #d1d5db;
        --bg-hover: #f0f0f0;
        --bg-disabled: #e5e7eb;
        
        --text-primary: #111827;
        --text-secondary: #374151;
        --text-tertiary: #6b7280;
        --text-disabled: #9ca3af;

        --border-primary: #e5e7eb;
        --border-secondary: #d1d5db;
        --border-color: #e5e7eb;
        
        --accent-primary: #4f46e5;
        --accent-primary-hover: #6366f1;
        --accent-text: #ffffff;
        --icon-hover-text: var(--text-primary);
        
        --destructive-bg: #dc2626; /* red-600 */
        --destructive-bg-hover: #ef4444; /* red-500 */
        --destructive-text: #dc2626; /* red-600 */
        
        --selection-stroke: #2563eb;
        --selection-fill: rgba(37, 99, 235, 0.2);
        --selection-highlight-bg: rgba(37, 99, 235, 0.4);
        --selection-highlight-text: var(--text-primary);
        --selection-highlight-comment-bg: rgba(37, 99, 235, 0.2);
        --selection-highlight-comment-text: #374151;
        --special-handle-fill: #f59e0b;
        --special-handle-stroke: #ea580c;

        --ruler-bg: #ffffff;
        --ruler-text: #4b5563;
        --ruler-tick: #d1d5db;
        
        --cursor-bg: var(--text-primary);
        --cursor-text: var(--bg-app);

        --brand-header-text: #4338ca;
        --brand-badge-bg: rgba(99, 102, 241, 0.09);
        --brand-badge-border: rgba(79, 70, 229, 0.35);
        --brand-badge-border-hover: rgba(109, 40, 217, 0.55);
        --brand-badge-shadow: rgba(79, 70, 229, 0.12);
        --brand-badge-text-start: #3730a3;
        --brand-badge-text-mid: #581c87;
        --brand-badge-text-end: #4338ca;
        --brand-badge-symbol: #3730a3;
        --brand-badge-dot-outer: rgba(79, 70, 229, 0.6);
        --brand-badge-dot-inner: #4338ca;
        --brand-badge-flourish: #4f46e5;

        --input-bg: #ffffff;
        --input-border: #d1d5db;
        --input-text: #111827;
        --input-placeholder: #9ca3af;
        --card-bg: #ffffff;
        --card-border: #e5e7eb;
        --modal-overlay: rgba(0, 0, 0, 0.45);
      }

      .code-line {
        padding-left: 2px;
        border-left: 4px solid transparent;
        transition: background-color 0.1s ease-in-out;
      }
      .code-line-highlighted {
        background-color: var(--selection-highlight-bg);
        color: var(--selection-highlight-text);
        font-weight: 600;
        border-left-color: var(--selection-stroke);
      }
      .code-line-comment-highlighted {
        background-color: var(--selection-highlight-comment-bg);
        color: var(--selection-highlight-comment-text);
        border-left-color: var(--selection-stroke);
        font-style: italic;
      }
      .line-number-highlighted {
        color: var(--selection-highlight-text);
        font-weight: 600;
      }

      @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-down {
        animation: fadeInDown 0.3s ease-out forwards;
      }
      
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.3s ease-out forwards;
      }
      
      @keyframes scrollText {
        0%, 20% { transform: translateX(0); }
        80%, 100% { transform: translateX(calc(-100% + var(--container-width, 100px))); }
      }
      .scroll-text-hover {
        display: inline-block;
        white-space: nowrap;
        animation: scrollText 4s linear infinite alternate;
      }

      /* Custom Scrollbars */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: var(--border-secondary);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: var(--text-disabled);
      }
    </style>
    <link rel="stylesheet" href="index.css">
  </head>
  <body class="dark-theme bg-[var(--bg-app)] text-[var(--text-primary)] font-sans">
    <div id="root"></div>
    <script type="module" src="pwa.ts"></script>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
